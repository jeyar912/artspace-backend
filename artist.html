<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist Panel - ArtSpace</title>
<style>
body{margin:0;font-family:'Arial';background:#111;color:white;}
header{background:#ff4d6d;padding:15px;text-align:center;font-size:1.5rem;font-weight:bold;box-shadow:0 4px 10px rgba(255,77,109,0.3);}
nav{display:flex;flex-wrap:wrap;}
nav button{flex:1;padding:12px;background:#222;color:white;border:none;cursor:pointer;transition:0.3s;margin:2px;}
nav button:hover{background:#ff4d6d;}
.section{display:none;padding:20px;}
.active{display:block;}
.card{background:#222;padding:15px;margin:15px 0;border-radius:12px;box-shadow:0 0 15px rgba(255,77,109,0.2);transition:0.3s;}
.card:hover{transform:scale(1.02);}
button.action{padding:6px 12px;margin:5px;cursor:pointer;border-radius:5px;border:none;background:#ff4d6d;color:white;transition:0.3s;}
button.action:hover{background:#ff1e4d;}
input, textarea, select{width:100%;padding:10px;margin:10px 0;border:none;border-radius:8px;background:#0f0f0f;color:white;}
img.artwork,img.profile-pic{max-width:150px;border-radius:8px;margin-top:5px;}
</style>
</head>
<body>
<header>Artist Panel</header>
<nav>
<button onclick="showSection('profile')">Profile</button>
<button onclick="showSection('upload')">Upload Artwork</button>
<button onclick="showSection('myworks')">My Artworks</button>
</nav>

<div id="profile" class="section active">
<h3>Profile</h3>
<p>Username: <span id="artistName"></span></p>
<p>Email: <span id="artistEmail"></span></p>

<label>Profile Picture</label>
<input type="file" id="profilePicInput" accept="image/*">
<img id="profilePicPreview" class="profile-pic" src="" alt="No image">

<label>Phone</label>
<input type="text" id="artistPhone" placeholder="Phone number">

<label>Address</label>
<input type="text" id="artistAddress" placeholder="Address">

<label>Website (optional)</label>
<input type="text" id="artistWebsite" placeholder="Website URL">

<label>Art Types (comma separated)</label>
<input type="text" id="artTypes" placeholder="e.g. Painting, Digital, Sculpture">

<label>Payment Methods Accepted (comma separated)</label>
<input type="text" id="paymentMethods" placeholder="e.g. PayPal, Mobile Money">

<button class="action" onclick="saveProfile()">Save Profile</button>
</div>

<div id="upload" class="section">
<h3>Upload Artwork</h3>
<input type="text" id="title" placeholder="Artwork Title">
<input type="text" id="type" placeholder="Artwork Type">
<input type="text" id="tags" placeholder="Tags (comma separated)">
<textarea id="desc" placeholder="Short Description"></textarea>
<input type="number" id="price" placeholder="Price ($)">
<label>Upload Image from Device</label>
<input type="file" id="fileInput" accept="image/*">
<button class="action" onclick="uploadArt()">Upload</button>
</div>

<div id="myworks" class="section">
<h3>My Artworks</h3>
<div id="artList"></div>
</div>

<script>
// Imerekebishwa kusoma kutoka Render Cloud Server yako live
const BASE_URL = "https://artspace-backend-1.onrender.com";

// ===== ACCESS CONTROL =====
if(localStorage.getItem('userRole') !== 'artist'){
    alert('Access denied');
    window.location.href='login.html';
}

const artistName = localStorage.getItem('artistName');
document.getElementById('artistName').innerText = artistName;

let artist = null; 

function showSection(id){
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// ===== LOAD ARTIST PROFILE FROM BACKEND =====
async function loadProfile(){
    try {
        const res = await fetch(`${BASE_URL}/api/artists?username=${artistName}`);
        const data = await res.json();
        if(data.length > 0){
            artist = data[0];
            document.getElementById('artistEmail').innerText = artist.email;
            document.getElementById('artistPhone').value = artist.phone || '';
            document.getElementById('artistAddress').value = artist.address || '';
            document.getElementById('artistWebsite').value = artist.website || '';
            document.getElementById('artTypes').value = (artist.artTypes || []).join(', ');
            document.getElementById('paymentMethods').value = (artist.paymentMethods || []).join(', ');
            if(artist.profilePic) document.getElementById('profilePicPreview').src = artist.profilePic;
        } else {
            alert('Artist profile could not be synced.');
        }
    } catch
